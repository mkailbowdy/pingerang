{{define "title"}}Login{{end}} {{define "main"}}
<section class="mx-auto grid max-w-5xl gap-6 py-8 lg:grid-cols-[0.9fr_1.1fr] lg:py-14">
  <div class="pixel-panel flex min-h-72 items-center justify-center overflow-hidden p-6">
    <div class="pixel-stage w-full">
      <div class="pixel-tower" aria-hidden="true">
        <span class="tower-spark tower-spark-a"></span>
        <span class="tower-spark tower-spark-b"></span>
        <span class="tower-spark tower-spark-c"></span>
        <span class="tower-cap"></span>
        <span class="tower-eye"></span>
        <span class="tower-body"></span>
        <span class="tower-base"></span>
      </div>
    </div>
  </div>

  <form action="/user/login" method="POST" class="pixel-panel p-5 sm:p-7" novalidate>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
    <p class="text-xs uppercase tracking-[0.28em] text-fuchsia-200">
      Load Save
    </p>
    <h1 class="mt-2 text-4xl font-black uppercase text-amber-200 text-shadow-pixel">
      Login
    </h1>

    <div class="mt-6 space-y-3">
      {{range .Form.NonFieldErrors}}
      <div class="pixel-error-box">{{.}}</div>
      {{end}}
    </div>

    <div class="mt-6 space-y-5">
      <div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label for="email" class="pixel-label">Email</label>
          {{with .Form.FieldErrors.email}}
          <span class="pixel-error">{{.}}</span>
          {{end}}
        </div>
        <input
          id="email"
          type="email"
          name="email"
          value="{{.Form.Email}}"
          required
          autocomplete="email"
          class="pixel-input mt-2"
        />
      </div>

      <div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label for="password" class="pixel-label">Password</label>
          {{with .Form.FieldErrors.password}}
          <span class="pixel-error">{{.}}</span>
          {{end}}
        </div>
        <input
          id="password"
          type="password"
          name="password"
          required
          autocomplete="current-password"
          class="pixel-input mt-2"
        />
      </div>
    </div>

    <button type="submit" value="Login" class="pixel-button mt-8 w-full">
      Enter Guild
    </button>

    <p class="mt-6 text-center text-sm text-cyan-50/75">
      New player?
      <a href="/user/signup" class="text-amber-200 underline decoration-fuchsia-300 decoration-2 underline-offset-4"
        >Create a save file</a
      >
    </p>
  </form>
</section>
{{end}}
