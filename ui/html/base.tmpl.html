{{define "base"}}
<!doctype html>
<html lang="en" class="min-h-full bg-[#140726] text-white">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{template "title" .}} - Pingerang</title>
    <link rel="stylesheet" href="/static/css/output.css?v=jrpg-2" />
    <script src="/static/js/htmx.min.js" defer></script>
  </head>

  <body
    class="min-h-full bg-[#140726] font-pixel text-slate-50 antialiased"
    hx-headers='{"X-CSRF-Token":"{{.CSRFToken}}"}'
  >
    <div class="pixel-world min-h-screen overflow-x-hidden bg-[#140726]">
      {{template "nav" .}}
      <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        {{with .Flash}}
        <div class="pixel-flash mb-6" role="status">{{.}}</div>
        {{end}} {{template "main" .}}
      </main>
      <footer
        class="mx-auto flex max-w-7xl items-center justify-between px-4 pb-8 pt-4 text-xs uppercase tracking-[0.22em] text-cyan-100/70 sm:px-6 lg:px-8"
      >
        <span>Pingerang Guild</span>
        <span>{{.CurrentYear}}</span>
      </footer>
    </div>
  </body>
</html>

{{end}}
