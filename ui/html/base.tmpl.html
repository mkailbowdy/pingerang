{{define "base"}}
<!doctype html>
<html lang='en' class="h-full bg-white dark:bg-gray-950 scheme-light dark:scheme-dark js-focus-visible">

<head>
  <meta charset='utf-8'>
  <title>{{template "title" .}} - Pingerang</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <script src="/static/js/htmx.min.js"></script>
</head>

<body class="h-full dark:text-white antialiased">
  <div class="min-h-full">
    {{template "nav" .}}
    <div class="py-10">
      <header>
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">{{.Page}}</h1>
        </div>
      </header>
      <main>
        <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
          <main>
            {{with .Flash}}
              <div>{{.}}</div>
            {{end}}
            {{template "main" .}}
          </main>
        </div>
      </main>
    </div>
  </div>
  <div class="flex justify-center">
    <footer>
      {{.CurrentYear}}
    </footer>
  </div>

</body>

</html>

{{end}}
