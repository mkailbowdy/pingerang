{{define "nav"}}
<nav class="border-b-4 border-cyan-300 bg-[#140726]/95 shadow-[0_8px_0_#05020f]">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex min-h-20 items-center justify-between gap-4 py-3">
      <a href="/" class="group flex min-w-0 items-center gap-3">
        <span class="pixel-logo" aria-hidden="true">PR</span>
        <span class="min-w-0">
          <span
            class="block truncate text-lg font-black uppercase tracking-[0.18em] text-amber-200 text-shadow-pixel sm:text-2xl"
            >Pingerang</span
          >
          <span class="block text-[0.65rem] uppercase tracking-[0.25em] text-fuchsia-200"
            >Web Watch Guild</span
          >
        </span>
      </a>

      <div class="hidden items-center gap-2 md:flex">
        {{if .IsAuthenticated}}
        <a
          href="/dashboard"
          class="pixel-nav-link {{if eq .Page `/dashboard`}}pixel-nav-link-active{{end}}"
          >Dashboard</a
        >
        <a
          href="/url/create"
          class="pixel-nav-link {{if eq .Page `/url/create`}}pixel-nav-link-active{{end}}"
          >Add URL</a
        >
        <form action="/user/logout" method="POST">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
          <button class="pixel-nav-link" type="submit">Logout</button>
        </form>
        {{else}}
        <a href="/user/signup" class="pixel-nav-link">Signup</a>
        <a href="/user/login" class="pixel-nav-link">Login</a>
        {{end}}
      </div>

      <details class="relative md:hidden">
        <summary class="pixel-menu-button list-none">Menu</summary>
        <div class="absolute right-0 z-30 mt-3 w-56 space-y-2 border-4 border-amber-200 bg-[#24104a] p-3 shadow-[6px_6px_0_#05020f]">
          {{if .IsAuthenticated}}
          <a
            href="/dashboard"
            class="pixel-nav-link block {{if eq .Page `/dashboard`}}pixel-nav-link-active{{end}}"
            >Dashboard</a
          >
          <a
            href="/url/create"
            class="pixel-nav-link block {{if eq .Page `/url/create`}}pixel-nav-link-active{{end}}"
            >Add URL</a
          >
          <form action="/user/logout" method="POST">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
            <button class="pixel-nav-link w-full" type="submit">Logout</button>
          </form>
          {{else}}
          <a href="/user/signup" class="pixel-nav-link block">Signup</a>
          <a href="/user/login" class="pixel-nav-link block">Login</a>
          {{end}}
        </div>
      </details>
    </div>
  </div>
</nav>
{{end}}
