{{define "change"}}
<div id="change{{.ID}}" class="pixel-alert mt-4">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-xs uppercase tracking-[0.22em] text-rose-100">
        Encounter
      </p>
      <p class="mt-1 text-sm font-black uppercase text-white">
        Page changed
      </p>
    </div>
    <div class="flex items-center gap-3">
      <span class="htmx-indicator pixel-loader" id="indicator{{.ID}}" aria-hidden="true"></span>
      <button
        class="pixel-small-button"
        hx-patch="/url/{{.ID}}"
        hx-vals='{"url": "{{.Url}}"}'
        hx-target="#change{{.ID}}"
        hx-swap="outerHTML"
        hx-indicator="#indicator{{.ID}}"
      >
        Mark Read
      </button>
    </div>
  </div>
</div>
{{end}}

{{define "nochange"}}
<div
  id="nochange{{.ID}}"
  class="pixel-calm mt-4"
  hx-trigger="every 3m"
  hx-vals='{"url": "{{.Url}}"}'
  hx-post="/url/{{.ID}}"
  hx-target="#nochange{{.ID}}"
  hx-swap="outerHTML"
>
  <div class="flex flex-wrap items-center gap-3">
    <span class="pixel-led" aria-hidden="true"></span>
    <p class="text-sm font-black uppercase text-lime-100">No changes</p>
    <p class="text-xs uppercase tracking-[0.18em] text-cyan-50/60">
      Auto patrol active
    </p>
  </div>
</div>
{{end}}
