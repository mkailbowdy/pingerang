<!--pseudo

I need to make sure nochange gets the ID so nochange knows which row it belongs to.

-->
{{define "change"}}
<div id="change{{.ID}}">
  <p class="mt-1 mb-1 truncate text-xs/5 text-green-500 dark:text-green-400">
    The site has changed!
  </p>
  <div class="flex">
    <button
      class="rounded-sm bg-indigo-600 px-2 py-1 text-xs font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400 dark:focus-visible:outline-indigo-500"
      hx-patch="/url/{{.ID}}"
      hx-vals='{"url": "{{.Url}}"}'
      hx-target="#change{{.ID}}"
      hx-swap="outerHTML"
      hx-indicator="#indicator{{.ID}}"
    >
      Mark as read.
    </button>
    <div class="htmx-indicator ml-2" id="indicator{{.ID}}">
      <svg
        width="18"
        height="18"
        viewBox="0 0 57 57"
        xmlns="http://www.w3.org/2000/svg"
        stroke="red"
      >
        <g fill="none" fill-rule="evenodd">
          <g transform="translate(1 1)" stroke-width="2">
            <circle cx="5" cy="50" r="5">
              <animate
                attributeName="cy"
                begin="0s"
                dur="2.2s"
                values="50;5;50;50"
                calcMode="linear"
                repeatCount="indefinite"
              />
              <animate
                attributeName="cx"
                begin="0s"
                dur="2.2s"
                values="5;27;49;5"
                calcMode="linear"
                repeatCount="indefinite"
              />
            </circle>
            <circle cx="27" cy="5" r="5">
              <animate
                attributeName="cy"
                begin="0s"
                dur="2.2s"
                from="5"
                to="5"
                values="5;50;50;5"
                calcMode="linear"
                repeatCount="indefinite"
              />
              <animate
                attributeName="cx"
                begin="0s"
                dur="2.2s"
                from="27"
                to="27"
                values="27;49;5;27"
                calcMode="linear"
                repeatCount="indefinite"
              />
            </circle>
            <circle cx="49" cy="50" r="5">
              <animate
                attributeName="cy"
                begin="0s"
                dur="2.2s"
                values="50;50;5;50"
                calcMode="linear"
                repeatCount="indefinite"
              />
              <animate
                attributeName="cx"
                from="49"
                to="49"
                begin="0s"
                dur="2.2s"
                values="49;5;27;49"
                calcMode="linear"
                repeatCount="indefinite"
              />
            </circle>
          </g>
        </g>
      </svg>
    </div>
  </div>
</div>
{{end}}

<!--pseudo

send the .ID to the handler of /url/id.
Change the trigger to update every hour.
-->
{{define "nochange"}}
<div id="nochange{{.ID}}">
  <p
    class="mt-1 truncate text-xs/5 text-gray-500 dark:text-gray-400"
    hx-trigger="every 2m"
    hx-vals='{"url": "{{.Url}}"}'
    hx-post="/url/{{.ID}}"
    hx-target="#nochange{{.ID}}"
    hx-swap="outerHTML"
  >
    No changes.
  </p>
</div>
{{end}}
